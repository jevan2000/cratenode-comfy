name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages (ffmpeg for video tests, fontconfig for skia)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libfontconfig1 libgl1
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow -r requirements.txt -r requirements-dev.txt
      - name: Unit tests (no ComfyUI needed)
        run: python -m unittest discover -s tests -v
